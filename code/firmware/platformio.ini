[platformio]
default_envs = esp32dev

; ---- Host unit tests: pure logic, no hardware (NFR-6) ----
[env:native]
platform = native
test_framework = unity
test_filter = test_*
; Third-party host-testable deps. Each lib that needs cJSON also declares it in its own
; library.json `dependencies` (that path DOES resolve for native) — keeping it here too
; is a second resolution path.
lib_deps =
    throwtheswitch/Unity@^2.6.1
    baracodadailyhealthtech/cJSON@^1.7.18
; The golden layout spec lives in tools/golden/ and is shared by the generator and the
; golden test, so the two cannot drift. -I is needed here because tools/ is not a library.
build_flags = -I tools/golden

; ---- Device firmware (FR-35). IDF pinned deliberately — see Global Constraints ----
[env:esp32dev]
platform = platformio/espressif32
board = esp32dev
framework = espidf
; ESP-IDF 5.5.3. Do NOT bump to 6.x: IDF 6.x requires toolchain
; esp-15.2.0_20251204 but PlatformIO ships GCC 14.2.0, which fails the version check.
platform_packages = platformio/framework-espidf @ ~3.50503.0
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -Wall -Wextra
test_framework = unity
